# Project-owned: LAN DNS for the Android phone. Upstream is DNS over TLS through the Happ tunnel,
# because plain UDP DNS to public resolvers gets no reply through the tunnel (2026-11-22).
# Installed on pi5home as /etc/unbound/unbound.conf.d/vpn-gateway-dns.conf (package: unbound).
server:
    interface: 192.168.0.118
    interface: 127.0.0.1
    ip-freebind: yes
    access-control: 192.168.0.0/24 allow
    access-control: 127.0.0.0/8 allow
    hide-identity: yes
    hide-version: yes

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 8.8.8.8@853#dns.google
    forward-addr: 8.8.4.4@853#dns.google
